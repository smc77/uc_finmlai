<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive atlas of the FIN 7057 Financial Machine Learning and AI course.">
  <title>Financial Machine Learning — A Course Atlas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to the course atlas</a>

  <header class="site-header">
    <a class="wordmark" href="#overview" aria-label="Course atlas overview">
      <span class="wordmark-mark" aria-hidden="true">F</span>
      <span>
        <strong>Financial Machine Learning</strong>
        <small>FIN 7057 · Course atlas</small>
      </span>
    </a>
    <div class="header-actions">
      <button class="text-button mobile-only" id="nav-toggle" type="button" aria-expanded="false" aria-controls="course-nav">Contents</button>
      <button class="text-button" id="reading-mode" type="button">Condense</button>
      <button class="text-button" id="glossary-toggle" type="button" aria-expanded="false" aria-controls="glossary">Glossary</button>
    </div>
  </header>

  <div class="site-shell">
    <aside class="course-nav" id="course-nav" aria-label="Course contents">
      <div class="nav-intro">
        <p class="kicker">The course in one path</p>
        <p>Dated information becomes a decision only after it survives modeling, implementation, and evidence.</p>
      </div>
      <nav id="topic-navigation"></nav>
      <a class="course-map-link" href="https://github.com/smc77/uc_finmlai/blob/main/docs/course_map.md">Full weekly course map <span aria-hidden="true">↗</span></a>
    </aside>

    <main id="main-content" tabindex="-1">
      <noscript>
        <div class="noscript">This atlas uses a small amount of JavaScript for navigation and diagrams. Please enable JavaScript to explore it.</div>
      </noscript>
      <div id="app" aria-live="polite"></div>
    </main>
  </div>

  <aside class="glossary" id="glossary" aria-label="Course glossary" aria-hidden="true">
    <div class="glossary-header">
      <div>
        <p class="kicker">Reference</p>
        <h2>Working vocabulary</h2>
      </div>
      <button class="icon-button" id="glossary-close" type="button" aria-label="Close glossary">×</button>
    </div>
    <label class="search-label" for="glossary-search">Find a term</label>
    <input class="search-input" id="glossary-search" type="search" placeholder="Try “leakage” or “calibration”" autocomplete="off">
    <dl id="glossary-list"></dl>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <script src="content.js"></script>
  <script src="hero-labs.js"></script>
  <script src="computational-labs.js"></script>
  <script src="app.js"></script>
</body>
</html>
